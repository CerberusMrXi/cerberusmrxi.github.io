---
layout: default
---

<div class="container">
  {% if page.title %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  {% endif %}

  <div class="article-content page-content">
    {{ content }}
  </div>
</div>
