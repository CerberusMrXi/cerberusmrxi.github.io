<div class="terminal-card">
  <div class="terminal-header">
    <div class="terminal-dots">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    <div class="terminal-title">whoami.sh — bash</div>
    <div style="width: 30px;"></div>
  </div>
  <div class="terminal-body" id="interactive-terminal">
    <div class="terminal-line">
      <span class="terminal-prompt">$</span> <span class="terminal-cmd">whoami</span>
    </div>
    <div class="terminal-line" style="color: var(--accent); font-weight: 600;">
      {{ site.author.prompt }}
    </div>
    <div class="terminal-line" style="margin-top: 0.5rem;">
      <span class="terminal-out-key">company</span> : <span class="terminal-out-val" style="color: var(--accent); font-weight: 600;">SerendibWare (Founder & CEO)</span>
    </div>
    <div class="terminal-line">
      <span class="terminal-out-key">role</span> : <span class="terminal-out-val">{{ site.author.role }}</span>
    </div>

    <div class="terminal-line">
      <span class="terminal-out-key">focus</span> : <span class="terminal-out-val">{{ site.author.focus }}</span>
    </div>
    <div class="terminal-line">
      <span class="terminal-out-key">languages</span> : <span class="terminal-out-val">{{ site.author.languages }}</span>
    </div>
    <div class="terminal-line">
      <span class="terminal-out-key">status</span> : <span class="terminal-out-val">{{ site.author.status }}</span>
    </div>
    <div class="terminal-line" style="margin-top: 0.75rem;">
      <span class="terminal-prompt">$</span> <span id="terminal-input"></span><span class="blinking-cursor"></span>
    </div>
  </div>
</div>
